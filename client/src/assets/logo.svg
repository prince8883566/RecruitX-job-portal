<svg width="200" height="42" viewBox="0 0 200 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon - Target/Crosshair with Person -->
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="18" cy="21" r="17" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
  <!-- Middle circle -->
  <circle cx="18" cy="21" r="12" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
  <!-- Inner circle -->
  <circle cx="18" cy="21" r="7" stroke="url(#logoGrad)" stroke-width="1.5" fill="none"/>
  <!-- Crosshair lines -->
  <line x1="18" y1="1" x2="18" y2="7" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="35" x2="18" y2="41" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="21" x2="6" y2="21" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="21" x2="36" y2="21" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Person silhouette -->
  <circle cx="18" cy="17" r="3.2" fill="url(#logoGrad)"/>
  <path d="M12.5 26.5C12.5 23 14.8 21 18 21C21.2 21 23.5 23 23.5 26.5" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- RecruitX Text -->
  <text x="44" y="29" font-family="'Segoe UI', 'Inter', 'Roboto', Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">
    Recruit<tspan fill="#0288D1">X</tspan>
  </text>
</svg>
